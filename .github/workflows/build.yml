name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DTM-Video-Player-APK
          path: app/build/outputs/apk/debug/*.apk
      - name: APK als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DTM-Video-Player.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DTM-Video-Player.apk --title "DTM Video Player (neuester Build)" --notes "Debug-APK zum Installieren" --target ${{ github.sha }}
